name: Supabase activity

on:
  schedule:
    - cron: '17 8,14,20 * * *'
  workflow_dispatch:

jobs:
  request-app:
    runs-on: ubuntu-latest
    steps:
      - name: Request the app
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 15 \
            --max-time 120 \
            https://laravel-task-tracker.onrender.com/
